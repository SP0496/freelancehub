name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            directory: backend/api-gateway/api-gateway
            database: fh_gateway_ci

          - service: marketplace-service
            directory: backend/marketplace-service/pom.xml/marketplace-service
            database: fh_marketplace

          - service: user-service
            directory: backend/user-service
            database: fh_user

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: ${{ matrix.database }}
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/${{ matrix.database }}
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_password

      DB_PASSWORD: ci_password
      MARKETPLACE_DB_PASSWORD: ci_password

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://localhost:8180/realms/freelancehub/protocol/openid-connect/certs

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify