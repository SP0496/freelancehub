spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3307/fh_user
spring.datasource.username=fh_user_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/freelancehub
spring.security.oauth2.resourceserver.jwt.audiences=freelancehub-api
spring.mvc.problemdetails.enabled=true

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:freelancehub}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:LocalAdminPassword123}
