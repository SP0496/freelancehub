spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/users/me

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/freelancehub
spring.security.oauth2.resourceserver.jwt.audiences=freelancehub-api