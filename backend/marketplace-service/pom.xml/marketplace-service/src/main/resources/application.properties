spring.application.name=marketplace-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/fh_marketplace
spring.datasource.username=fh_marketplace_app
spring.datasource.password=${MARKETPLACE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/freelancehub
spring.security.oauth2.resourceserver.jwt.audiences=freelancehub-api
spring.mvc.problemdetails.enabled=true
