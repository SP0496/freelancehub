services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=64M", "--max-connections=30"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fh_user
      MYSQL_USER: fh_user_app
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    restart: always
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?Set KEYCLOAK_HOSTNAME e.g. http://<EC2_PUBLIC_IP>:8180}
    ports:
      - "0.0.0.0:8180:8080"
    volumes:
      - identity-data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
      - ./infra/keycloak/providers:/opt/keycloak/providers:ro

  user-service:
    image: freelancehub-user-service:prod
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_DIR: backend/user-service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx220m -XX:+UseSerialGC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fh_user
      SPRING_DATASOURCE_USERNAME: fh_user_app
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD}
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_HOSTNAME}/realms/freelancehub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://identity:8080/realms/freelancehub/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://identity:8080
      KEYCLOAK_REALM: freelancehub
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-superadmin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_started

  marketplace-service:
    image: freelancehub-marketplace-service:prod
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_DIR: backend/marketplace-service/pom.xml/marketplace-service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx220m -XX:+UseSerialGC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fh_marketplace
      SPRING_DATASOURCE_USERNAME: fh_marketplace_app
      SPRING_DATASOURCE_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Set MARKETPLACE_DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_HOSTNAME}/realms/freelancehub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://identity:8080/realms/freelancehub/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_started

  api-gateway:
    image: freelancehub-api-gateway:prod
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_DIR: backend/api-gateway/api-gateway
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx180m -XX:+UseSerialGC
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_HOSTNAME}/realms/freelancehub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://identity:8080/realms/freelancehub/protocol/openid-connect/certs
      SPRING_APPLICATION_JSON: >-
        {
          "spring.cloud.gateway.server.webflux.routes": [
            {
              "id": "user-service",
              "uri": "http://user-service:8081",
              "predicates": ["Path=/api/v1/users/me,/api/v1/auth/**"]
            },
            {
              "id": "marketplace-service",
              "uri": "http://marketplace-service:8082",
              "predicates": [
                "Path=/api/v1/projects,/api/v1/projects/**,/api/v1/proposals/mine"
              ]
            }
          ]
        }
    depends_on:
      user-service:
        condition: service_started
      marketplace-service:
        condition: service_started
      identity:
        condition: service_started

  frontend:
    image: freelancehub-frontend:prod
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mysql-data:
  identity-data:
